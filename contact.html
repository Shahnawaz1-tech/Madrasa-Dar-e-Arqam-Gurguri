<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>رابطہ | مدرسہ دارِ ارقم گرگری</title>
  <meta name="description" content="مدرسہ دارِ ارقم گرگری سے رابطہ کریں۔">
  <link rel="icon" href="images/favicon-32.png">
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<main class="inner-page">
  <header class="inner-page-hero"><div class="container"><span class="about-eyebrow" data-i18n="nav.contact">رابطہ</span><h1 data-i18n="con.title">رابطہ کریں</h1><p data-i18n="con.addr">گرگری، پاکستان</p></div></header>
  <section id="contact"><div class="container"><div class="row g-5">
    <div class="col-lg-5"><h2 class="section-title" data-i18n="con.title">رابطہ کریں</h2><hr class="rule">
      <div class="contact-line"><div class="ico"><i class="bi bi-geo-alt"></i></div><div><strong data-i18n="con.addrT">پتہ</strong><br><span data-i18n="con.addr">گرگری، پاکستان</span></div></div>
      <div class="contact-line"><div class="ico"><i class="bi bi-telephone"></i></div><div><strong data-i18n="con.phoneT">فون اور واٹس ایپ</strong><br><a href="tel:+923349798988" dir="ltr" data-i18n="con.phoneValue">00923349798988</a></div></div>
      <div class="contact-line"><div class="ico"><i class="bi bi-envelope"></i></div><div><strong data-i18n="con.emailT">ای میل</strong><br><a href="mailto:qarimuhammadarif988@gmail.com" dir="ltr" data-i18n="con.emailValue">qarimuhammadarif988@gmail.com</a></div></div>
      <div class="contact-line"><div class="ico"><i class="bi bi-clock"></i></div><div><strong data-i18n="con.hoursT">دفتری اوقات</strong><br><span data-i18n="con.hours">ہفتہ تا جمعرات، صبح 8 بجے سے دوپہر 2 بجے</span></div></div>
      <div class="map-box mt-4"><div><i class="bi bi-map fs-2"></i><div data-i18n="con.map">یہاں نقشہ آئے گا (گوگل میپ)</div></div></div>
    </div>
    <div class="col-lg-7"><form id="contactForm" class="result-box" novalidate><h2 class="h4 mb-3" data-i18n="con.formT">پیغام بھیجیں</h2><div class="row g-3">
      <div class="col-md-6"><label class="form-label" for="cName" data-i18n="con.name">آپ کا نام</label><input id="cName" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label" for="cPhone" data-i18n="con.phone">موبائل نمبر</label><input id="cPhone" class="form-control" dir="ltr" required></div>
      <div class="col-12"><label class="form-label" for="cTopic" data-i18n="con.topic">موضوع</label><select id="cTopic" class="form-select"><option data-i18n="con.t1">داخلہ</option><option data-i18n="con.t2">فیس</option><option data-i18n="con.t3">نتائج</option><option data-i18n="con.t4">دیگر</option></select></div>
      <div class="col-12"><label class="form-label" for="cMsg" data-i18n="con.msg">پیغام</label><textarea id="cMsg" rows="4" class="form-control" required></textarea></div>
      <div class="col-12"><button class="btn btn-green" type="submit" data-i18n="con.send">پیغام بھیجیں</button></div>
    </div><div id="contactAlert" class="mt-3" role="status"></div></form></div>
  </div></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/page-shell.js"></script>
<script src="js/script.js"></script>
</body>
</html>
