<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نتائج | مدرسہ دارِ ارقم گرگری</title>
  <meta name="description" content="داخلی اور وفاق المدارس کے امتحانی نتائج دیکھیں۔">
  <link rel="icon" href="images/favicon-32.png">
  <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="results">
<main class="inner-page">
  <header class="inner-page-hero"><div class="container"><span class="about-eyebrow" data-i18n="res.eyebrow">نتائج</span><h1 data-i18n="res.title">اپنا نتیجہ دیکھیں</h1><p data-i18n="res.sub">رول سلپ پر درج رول نمبر اور رجسٹریشن نمبر لکھیں۔</p></div></header>
  <section id="results"><div class="container">
    <div class="res-tabs" role="tablist" aria-label="امتحان کی قسم"><button class="res-tab active" id="tab-internal" type="button" role="tab" aria-selected="true" aria-controls="panel-internal" data-i18n="res.tabInternal">داخلی امتحان</button><button class="res-tab" id="tab-wifaq" type="button" role="tab" aria-selected="false" aria-controls="panel-wifaq" data-i18n="res.tabWifaq">وفاق المدارس</button></div>
    <div id="panel-internal" role="tabpanel" aria-labelledby="tab-internal"><div class="row g-4 mt-1">
      <div class="col-lg-5"><form id="resultForm" class="result-box" novalidate><div class="res-form-header"><span class="res-form-badge"><i class="bi bi-building me-1"></i><span data-i18n="res.tabInternal">داخلی امتحان</span></span></div>
        <div class="mb-3"><label for="rollNo" class="form-label" data-i18n="res.roll">رول نمبر</label><input type="text" class="form-control" id="rollNo" placeholder="2026-001" required dir="ltr"></div>
        <div class="mb-3"><label for="regNo" class="form-label" data-i18n="res.reg">رجسٹریشن نمبر</label><input type="text" class="form-control" id="regNo" placeholder="REG-2026-0001" required dir="ltr"></div>
        <button type="submit" class="btn btn-green w-100" data-i18n="res.btn">نتیجہ دکھائیں</button><p class="form-text mt-2" data-i18n="res.hint">صرف نمونہ: 2026-001 اور REG-2026-0001 لکھ کر دیکھیں۔</p>
      </form></div><div class="col-lg-7"><div id="resultOut" aria-live="polite"></div></div>
    </div></div>
    <div id="panel-wifaq" role="tabpanel" aria-labelledby="tab-wifaq" hidden><div class="row g-4 mt-1">
      <div class="col-lg-5"><form id="resultFormWifaq" class="result-box" novalidate><div class="res-form-header"><span class="res-form-badge res-form-badge--wifaq"><i class="bi bi-award me-1"></i><span data-i18n="res.tabWifaq">وفاق المدارس</span></span></div>
        <div class="mb-3"><label for="wifaqRoll" class="form-label" data-i18n="res.wifaqRoll">وفاق رول نمبر</label><input type="text" class="form-control" id="wifaqRoll" placeholder="WM-2026-001" required dir="ltr"></div>
        <div class="mb-3"><label for="wifaqReg" class="form-label" data-i18n="res.wifaqReg">وفاق رجسٹریشن نمبر</label><input type="text" class="form-control" id="wifaqReg" placeholder="WRG-2026-0001" required dir="ltr"></div>
        <button type="submit" class="btn btn-green w-100" data-i18n="res.btn">نتیجہ دکھائیں</button><p class="form-text mt-2" data-i18n="res.wifaqHint">صرف نمونہ: WM-2026-001 اور WRG-2026-0001 لکھ کر دیکھیں۔</p>
      </form></div><div class="col-lg-7"><div id="resultOutWifaq" aria-live="polite"></div></div>
    </div></div>
  </div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/page-shell.js"></script>
<script src="js/script.js"></script>
</body>
</html>
